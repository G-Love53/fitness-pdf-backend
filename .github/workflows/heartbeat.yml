name: Leg 2 Robot Heartbeat

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: heartbeat-wake-up-service
  cancel-in-progress: false

jobs:
  wake-up-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poke CID-PDF-API
        env:
          HEARTBEAT_URL: https://cid-pdf-api.onrender.com/healthz
        run: |
          set -euo pipefail
          echo "Sending heartbeat to ${HEARTBEAT_URL}"
          curl --request GET "${HEARTBEAT_URL}" \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 90 \
            --retry-all-errors
